apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-rds
  namespace: ack-system
spec:
  interval: 10m
  chart:
    spec:
      chart: rds-chart
      version: "1.4.x"
      sourceRef:
        kind: HelmRepository
        name: ack-charts
        namespace: flux-system
  values:
    aws:
      region: us-east-1
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ack-rds-controller
